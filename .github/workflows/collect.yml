name: Collect daily rack prices

on:
  push:
    branches:
      - main
  schedule:
    # Frequent checks reduce the lag caused by GitHub's best-effort scheduler.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-rack-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/collect.py
      - run: python scripts/collect_regulated.py
      - name: Detect source changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- docs/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit new snapshot
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "data: refresh fuel prices $(date -u +%F-%H%M)"
          git push
      - uses: actions/configure-pages@v5
        if: steps.changes.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v4
        if: steps.changes.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: docs
      - name: Deploy dashboard to GitHub Pages
        if: steps.changes.outputs.changed == 'true' || github.event_name != 'schedule'
        id: deployment
        uses: actions/deploy-pages@v4
